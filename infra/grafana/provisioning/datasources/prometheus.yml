apiVersion: 1

# Se elimina la definición anterior (sin uid fijo) y se vuelve a crear con uid estable,
# para que los dashboards versionados siempre encuentren su fuente de datos.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
